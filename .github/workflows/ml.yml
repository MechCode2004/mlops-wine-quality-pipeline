name: ML Pipeline CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: make install

      - name: Ejecutar lint
        run: make lint

      - name: Ejecutar pruebas
        run: make test

      - name: Entrenar modelo
        run: make train

      - name: Guardar modelo como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: wine-quality-model
          path: models/

      - name: Guardar experimentos MLflow como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs
          path: mlruns/